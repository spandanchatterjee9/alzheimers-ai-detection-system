# Global Configuration for Alzheimer's Disease Detection System Preprocessing Engine

dataset:
  raw_dirs:
    - "."
    - "dataset/raw"
  disc_prefix: "oasis_cross-sectional_disc"
  processed_dir: "dataset/processed"
  processed_labelled_dir: "dataset/processed/labelled"
  processed_unlabelled_dir: "dataset/processed/unlabelled"
  manifests_dir: "dataset/manifests"
  manifest_path: "dataset/manifests/dataset_manifest.csv"
  labelled_manifest_path: "dataset/manifests/labelled_manifest.csv"
  unlabelled_manifest_path: "dataset/manifests/unlabelled_manifest.csv"

volume_specs:
  target_shape: [128, 128, 128]
  target_spacing: [1.0, 1.0, 1.0]
  orientation: "RAS"
  expected_native_shape: [256, 256, 160]

normalization:
  method: "z_score"       # Options: z_score, min_max, peak
  clip_percentiles: [0.5, 99.5]
  min_max_range: [0.0, 1.0]

cropping:
  enabled: true
  background_threshold: 0.0
  padding_voxels: 4

resizing:
  interpolation_order: 3        # Cubic spline for 3D volumes
  slice_interpolation_order: 1  # Linear for 2D slices

slice_extraction:
  axes: ["axial", "coronal", "sagittal"]
  target_slice_shape: [224, 224]
  quality_filter:
    enabled: true
    min_foreground_ratio: 0.15  # Minimum 15% brain tissue foreground
    min_entropy: 1.5            # Minimum Shannon entropy threshold

splits:
  train_ratio: 0.80
  val_ratio: 0.10
  test_ratio: 0.10
  stratify_col: "CDR"
  random_seed: 42
  train_path: "dataset/manifests/train.csv"
  val_path: "dataset/manifests/validation.csv"
  test_path: "dataset/manifests/test.csv"

performance:
  num_workers: 4
  force_reprocess: false
  save_nifti: true
  save_pytorch_tensor: true
  save_diagnostic_preview: true

logging:
  level: "INFO"
  log_file: "logs/preprocessing.log"
  resume_enabled: true
